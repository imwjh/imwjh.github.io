        /* 禁用所有元素的触摸高亮反馈 */

        /* * 设计风格：日式极简

        @font-face {

            font-display: swap;

        * {

            padding: 0;
            box-sizing: border-box;
        }

        /* 无障碍：视觉隐藏但屏幕阅读器可读 */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* 宣纸晕染动画定义 */
        @keyframes washiFadeIn {
            0% {
                opacity: 0;
                filter: blur(5px);
                /* 初始模糊，模拟墨水未干 */
                transform: scale(0.98);
            }

            100% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1);
            }
        }

        body {
            background-color: #F0EEE6;
            color: #2A2A2A;
            font-family: 'Pangolin', 'AaWanWan', 'JapaneseMinimal', serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            /* 应用动画：1.2秒持续时间，缓动效果 */
            animation: washiFadeIn 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        header {
            padding: 10vh 0 5vh 0;
            text-align: center;
        }

        /* 顶部 Logo 链接样式重置，确保视觉无变化 */
        header a {
            display: block;
            text-decoration: none;
            color: inherit;
        }

        .site-logo {
            height: 1.4rem;
            width: auto;
            display: block;
            margin: 0 auto;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .nav-group {
            margin-bottom: 3rem;
        }

        .divider {
            height: 1px;
            background-color: #E0DDD9;
            width: 30px;
            margin: 0 auto 3rem auto;
        }

        .link-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            align-items: center;
        }

        .link-item a {
            text-decoration: none;
            color: #2A2A2A;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            letter-spacing: 0.15em;
            transition: color 0.4s ease;
        }

        .icon {
            width: 16px;
            height: 16px;
            margin-right: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.2;
        }

        .link-item a:hover {
            color: #9A8B78;
        }

        /* 中文（AaWanWan 手写体）单独增大一号。
           AaWanWan 仅单一字重，font-weight 无中间档；
           用极细描边模拟"轻加粗"，居于默认与合成粗体之间 */
        .link-item a .zh {
            font-size: 1.15em;
            -webkit-text-stroke: 0.3px currentColor;
            text-stroke: 0.3px currentColor;
        }

        footer {

        }

            main {
                max-width: 80%;
