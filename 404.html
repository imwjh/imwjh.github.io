<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F9F7F4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#F9F7F4" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="msapplication-TileColor" content="#F9F7F4">
    <title>404</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
		/* 禁用所有元素的触摸高亮反馈 */
       * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
      
        /* * 设计风格：日式极简 (Japanese Minimalism)
         * 404 页面核心：空灵、指引、归静
         */

        @font-face {
            font-family: 'JapaneseMinimal';
            src: local('Noto Serif CJK SC Light'), local('Source Han Serif SC Light'), local('Songti SC'), serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 宣纸晕染动画 */
        @keyframes washiFadeIn {
            0% {
                opacity: 0;
                filter: blur(8px);
                transform: scale(0.99);
            }
            100% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1);
            }
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #F9F7F4;
        }

        body {
            color: #2A2A2A;
            font-family: 'JapaneseMinimal', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
            animation: washiFadeIn 1.5s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            overflow: hidden;
        }

        /* 404 数字背景 - 极其浅淡，若隐若现 */
        .error-code {
            position: absolute;
            font-size: 15rem;
            color: #EBE9E6;
            z-index: -1;
            letter-spacing: -0.05em;
            user-select: none;
        }

        .content-box {
            text-align: center;
            padding: 20px;
        }

        .status-text {
            font-size: 1.1rem;
            letter-spacing: 0.4em;
            margin-bottom: 2rem;
            font-weight: 300;
            color: #9A8B78; /* 茶褐色点缀 */
        }

        .description {
            font-size: 0.9rem;
            color: #666;
            letter-spacing: 0.2em;
            margin-bottom: 4rem;
        }

        .divider {
            height: 1px;
            background-color: #E0DDD9;
            width: 40px;
            margin: 0 auto 3rem auto;
        }

        /* 返回链接 */
        .back-home {
            text-decoration: none;
            color: #2A2A2A;
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            border: 1px solid #2A2A2A;
            padding: 12px 30px;
            transition: all 0.4s ease;
            display: inline-block;
        }

        .back-home:hover {
            color: #F9F7F4;
            background-color: #2A2A2A; /* 极简黑白反转交互 */
        }

        footer {
            position: absolute;
            bottom: 10vh;
            text-align: center;
            width: 100%;
        }

        .copyright {
            font-size: 0.65rem;
            color: #B0B0B0;
            letter-spacing: 0.1em;
        }

        @media (max-width: 768px) {
            .error-code { font-size: 8rem; }
            .status-text { font-size: 1rem; }
        }
    </style>
    <script>
        // 复刻 index (27).html 的核心技术：动态同步主题色
        function setThemeColor(color) {
            let meta = document.querySelector('meta[name="theme-color"]');
            if (!meta) {
                meta = document.createElement('meta');
                meta.name = "theme-color";
                document.getElementsByTagName('head')[0].appendChild(meta);
            }
            meta.setAttribute('content', color);
        }

        function syncTheme() {
            const color = window.getComputedStyle(document.body).backgroundColor;
            if (color.startsWith('rgb')) {
                const rgb = color.match(/\d+/g);
                const hex = "#" + ((1 << 24) + (parseInt(rgb[0]) << 16) + (parseInt(rgb[1]) << 8) + parseInt(rgb[2])).toString(16).slice(1);
                setThemeColor(hex);
            } else {
                setThemeColor(color || "#F9F7F4");
            }
        }

        syncTheme();
        window.addEventListener('scroll', syncTheme, { passive: true });
        document.body.addEventListener('animationend', syncTheme);
        setTimeout(syncTheme, 1500); // 404 页面的动画时间稍长
    </script>
</head>
<body>

    <div class="error-code">404</div>

    <div class="content-box">
        <h1 class="status-text">此路不通</h1>
        <p class="description">你所找寻的风景，或许已消失在远山之中。</p>
        
        <div class="divider"></div>

        <a href="index.html" class="back-home">返回首页 / BACK HOME</a>
    </div>

    <footer>
        <p class="copyright">© 2026 SEEGooD ALL RIGHTS RESERVED</p>
    </footer>

</body>
</html>
